name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Installed plugins run dist/ as committed, so it must match the sources.
      - name: dist matches a fresh build
        run: npm run build && git diff --exit-code -- dist
      - run: npm test
      # The mod test kit and validator ship in the CLI; neither needs a login.
      # test:integration is left to local runs: it drives real `claude -p` sessions.
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - run: npm run validate
      - run: npm run test:plugin
